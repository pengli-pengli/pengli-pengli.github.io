# UPDATES (the homepage shows the three newest as picture cards, sorted by date)
# To add one, paste a block anywhere in this list. Older updates can stay; they are simply not shown.
#
# Fields:
#   date: YYYY-MM-DD
#   type: a short label shown on the picture (Talk, Paper, Position, Grant, Workshop...)
#   title: short, shown on the picture (about 8 words or fewer reads best)
#   link: where the title leads (optional)
#   image: a photo in media/images/updates/, written as /media/images/updates/name.jpg
#          (landscape photos work best; without one, a plain colored card is shown)
#   description: one or two sentences shown under the picture
#   zh: (optional) Chinese versions for the Chinese page; any field left out falls back to English
#     title: ...
#     description: ...
#     type: ... (Talk, Paper, Workshop, Position, Grant, Award, Book are translated automatically)
#
# Example:
#   - date: 2026-06-24
#     type: Talk
#     title: Talk at EuroSLA35
#     link: https://eurosla35.fcsh.unl.pt/program-participation/
#     image: /media/images/updates/eurosla35.jpg
#     description: "Comparing audio-visual and audio-tactile training of Italian stops."
#
# Put text in "double quotes" when it contains a colon followed by a space, or starts with a symbol.

