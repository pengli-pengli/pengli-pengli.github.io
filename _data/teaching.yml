# "linguistics" entries:
#   - term: 2025-2026 Fall semester
#     course: Quantitative methods
#     code: (optional, e.g. MULTI4150)
#     level: Master
#     program: Cognitive Neuroscience of Language
#     institution: BCBL-University of the Basque Country, Spain
#
# Other sections group courses by academic year; add a line under "courses", or a new block:
#   - term: 2016-2017 academic year
