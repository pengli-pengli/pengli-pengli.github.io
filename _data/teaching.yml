#       - Japanese Reading 1 (1231134), 2nd-year Japanese BA course, 32 h
#
# CHINESE PAGE: entries show in English on the Chinese page unless they have a "zh:" block.
# Inside it, give only the fields you want in Chinese; the rest fall back to English.
# Fall semester = 第一学期, Spring semester = 第二学期.
# Example for a "linguistics" entry (the course name is put in 《》 automatically):
#     zh:
#       term: 2025-2026学年第一学期
#       course: 量化研究方法
#       program: 西班牙巴斯克大学和巴斯克认知、脑与语言研究中心（BCBL）联合开设的语言认知神经科学硕士学位课程
# Example for a block in the other sections:
#     zh:
#       term: 2016-2017学年
#       courses:
#         - 日语阅读1（1231134），日语专业二年级课程，32学时
#
# Put text in "double quotes" when it contains a colon followed by a space, or starts with a symbol.

