# PUBLICATIONS
# Sections: journal_articles, book_chapters, proceedings. Newest first.
# To add an item, copy an entry, paste it at the top of its section, and edit it.
# Keep the two-space indent and the "- " in front of the first line.
# Your name ("Li, P." or "Li, P.*") is bolded automatically. Titles get a final period automatically.
#
# Journal article fields: authors, year, title, journal, volume, issue, pages, doi
# Chapter or proceedings fields: authors, year, title, editors, book, details, doi
# Optional: doi_link (if the DOI should open another page), pdf + pdf_label,
#           isbn + isbn_link, award + award_link
#
# Example:
#   - authors: Li, P.*, Martin, C. D., & Kartushina, N.
#     year: 2026
#     title: "Same vowels, distinct sounds: Phonetic differentiation in early Basque-Spanish bilinguals’ vowel production"
#     journal: Linguistic Approaches to Bilingualism
#     doi: 10.1075/lab.25054.li
#
#
# CHINESE PAGE: citations are shown as they are. To translate an award label, add
#     zh:
#       award: 最佳报告奖
# Put text in "double quotes" when it contains a colon followed by a space, or starts with a symbol.

