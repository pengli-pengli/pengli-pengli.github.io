# SUPERVISION
# Sections: phd, master, undergraduate. Newest first.
# To add a student, copy an entry, paste it at the top of its section, and edit it.
#
# Fields: student, year (e.g. 2026 or "expected 2029"), title, type, institution
# Optional: title_original (shown after the title in gray), status (e.g. Discontinued)
# In a zh block you can also add title_translation (shown in brackets after the title).
# Titles in a zh block show in 《》; add title_lang: ja for Japanese titles (shown in 『』).
# Titles left in English show in “ ”.
#
# Example:
#   - student: Huiyi Hu
#     year: expected 2029
#     title: "Foreign Directed Speech: Didactic function and impact"
#     type: PhD dissertation
#     institution: University of the Basque Country
#
#
# CHINESE PAGE: entries show in English on the Chinese page unless you add a "zh:" block.
# Inside it, give only the fields you want in Chinese; the rest fall back to English.
# Example (indent the zh fields by two more spaces):
#   - student: Huiyi Hu
#     ...
#     zh:
#       student: （学生中文名）
#       year: 预计2029年
#       type: 博士学位论文
#       institution: 西班牙巴斯克大学
#
# Put text in "double quotes" when it contains a colon followed by a space, or starts with a symbol.

